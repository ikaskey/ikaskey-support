# pnpm 12 は許可していない依存の postinstall があると install を止めるため、明示的に許可する
allowBuilds:
  esbuild: true
  sharp: true

# 脆弱性対応のための間接依存の上げ（pnpm audit, 2026-10）
overrides:
  # astro 6 は sharp を optionalDependencies の ^0.34.0 で持つため、直接の依存を 0.35 にしても
  # astro の画像処理は 0.34.5 のまま残る（high 3 件）。astro 6 の sharp を 0.35 に寄せる。
  # 0.35 で画像が作られることはビルドで確かめた。astro 7 に上げたら外す
  sharp@^0.34: ^0.35.5
